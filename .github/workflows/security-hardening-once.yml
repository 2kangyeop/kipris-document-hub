name: Zero-tolerance security hardening

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-hardening-once.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  harden:
    runs-on: windows-2025
    timeout-minutes: 35

    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Apply minimal fail-closed TLS hardening
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          api = Path('api_client.py')
          text = api.read_text(encoding='utf-8')
          original = text
          text, n_ssl = re.subn(r'^import ssl\r?\n', '', text, count=1, flags=re.M)
          text, n_handler = re.subn(
              r'from urllib\.request import HTTPSHandler, Request, build_opener',
              'from urllib.request import Request, build_opener',
              text,
              count=1,
          )
          pattern = re.compile(
              r'(?ms)^        self\.allow_insecure_tls = allow_insecure_tls\r?\n'
              r'        self\.cancel_event = cancel_event\r?\n'
              r'        if allow_insecure_tls:\r?\n'
              r'            context = ssl\.SSLContext\(ssl\.PROTOCOL_TLS_CLIENT\)\r?\n'
              r'            context\.check_hostname = False\r?\n'
              r'            context\.verify_mode = ssl\.CERT_NONE\r?\n'
              r'            self\.opener = build_opener\(HTTPSHandler\(context=context\)\)\r?\n'
              r'        else:\r?\n'
              r'            self\.opener = build_opener\(\)\r?\n'
          )
          replacement = (
              '        if allow_insecure_tls:\n'
              '            raise ValueError(\n'
              '                "TLS 인증서 검증 비활성화는 보안 정책상 허용되지 않습니다. "\n'
              '                "사내 CA 인증서를 Windows 신뢰 저장소에 등록해 주세요."\n'
              '            )\n'
              '        self.allow_insecure_tls = False\n'
              '        self.cancel_event = cancel_event\n'
              '        self.opener = build_opener()\n'
          )
          text, n_block = pattern.subn(replacement, text, count=1)
          if (n_ssl, n_handler, n_block) != (1, 1, 1):
              raise SystemExit(f'Refusing unsafe TLS patch: ssl={n_ssl}, handler={n_handler}, block={n_block}')
          if any(token in text for token in ('ssl.CERT_NONE', 'check_hostname = False', 'HTTPSHandler(')):
              raise SystemExit('TLS bypass token remains after patch.')
          if abs(len(original) - len(text)) > 1200:
              raise SystemExit('Unexpected api_client.py change size.')
          api.write_text(text, encoding='utf-8', newline='\n')

          web = Path('web_app.py')
          wtext = web.read_text(encoding='utf-8')
          wtext, n_state = re.subn(
              r'self\.allow_insecure_tls = bool\(config\.get\("allow_insecure_tls", False\)\)',
              'self.allow_insecure_tls = False',
              wtext,
              count=1,
          )
          if n_state != 1:
              raise SystemExit(f'Refusing web_app.py patch: state occurrences={n_state}')
          web.write_text(wtext, encoding='utf-8', newline='\n')
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\patch_tls.py
          python $env:RUNNER_TEMP\patch_tls.py

      - name: Write permanent security gate
        shell: pwsh
        run: |
          @'
          from __future__ import annotations
          from pathlib import Path
          import re

          FORBIDDEN = {
              'TLS certificate verification disabled': (
                  r'ssl\.CERT_NONE',
                  r'check_hostname\s*=\s*False',
                  r'_create_unverified_context',
                  r'(?<![A-Za-z])verify\s*=\s*False',
              ),
              'destructive command': (
                  r'\brm\s+-rf\b',
                  r'\bchmod\s+777\b',
                  r'\bDROP\s+TABLE\b',
              ),
          }
          SCAN_SUFFIXES = {'.py', '.ps1', '.bat', '.vbs', '.yml', '.yaml'}
          EXCLUDED = {
              Path('.github/workflows/security-hardening-once.yml'),
              Path('security_gate.py'),
          }
          violations = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in SCAN_SUFFIXES or path in EXCLUDED:
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              for label, patterns in FORBIDDEN.items():
                  for pattern in patterns:
                      if re.search(pattern, text, re.I):
                          violations.append(f'{path}: {label}')
          if violations:
              raise SystemExit('Security policy violation(s):\n' + '\n'.join(sorted(set(violations))))
          print('Zero-tolerance static security gate passed.')
          '@ | Set-Content -Encoding utf8 security_gate.py
          python security_gate.py

      - name: Resolve exact Windows wheels
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force wheelhouse | Out-Null
          python -m pip download --disable-pip-version-check --only-binary=:all: --dest wheelhouse -r requirements.txt pyinstaller==6.22.2

      - name: Generate SHA-256 dependency lock
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib
          import re

          rows = []
          for wheel in sorted(Path('wheelhouse').glob('*.whl')):
              parts = wheel.stem.split('-')
              if len(parts) < 5:
                  raise SystemExit(f'Invalid wheel filename: {wheel.name}')
              name = re.sub(r'[-_.]+', '-', parts[0]).lower()
              version = parts[1]
              digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
              rows.append((name, version, digest, wheel.name))

          seen = set()
          lines = [
              '# CPython 3.12 / Windows x64 dependency lock.',
              '# Exact resolved wheels; every package is SHA-256 pinned.',
          ]
          for name, version, digest, filename in sorted(rows):
              if name in seen:
                  raise SystemExit(f'Duplicate resolved distribution: {name}')
              seen.add(name)
              lines.append(f'{name}=={version} --hash=sha256:{digest}  # {filename}')
          Path('requirements.lock').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\make_lock.py
          python $env:RUNNER_TEMP\make_lock.py

      - name: Verify locked install offline and run tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-index --find-links wheelhouse --only-binary=:all: --require-hashes -r requirements.lock
          python security_gate.py
          python -m unittest discover -s . -p "test_*.py"

      - name: Confirm bounded change scope
        shell: pwsh
        run: |
          $allowed = @('api_client.py','web_app.py','security_gate.py','requirements.lock')
          $status = git status --porcelain
          foreach ($line in $status) {
            $file = $line.Substring(3).Trim()
            if ($allowed -notcontains $file) { throw "Unexpected changed file: $file" }
          }
          git diff --check

      - name: Create security review pull request
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branch = 'security/zero-tolerance-v6.13.2-v4'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b $branch
          git add api_client.py web_app.py security_gate.py requirements.lock
          git commit -m 'Apply zero-tolerance source security hardening'
          git push origin $branch
          gh pr create --base main --head $branch --title 'Zero-tolerance source security hardening for v6.13.2' --body 'Removes the TLS verification bypass, prevents restoring the legacy insecure-TLS flag, adds a permanent static security gate, SHA-256 locks the exact Windows/Python wheel set, and verifies the complete dependency lock offline before running the regression suite.'
