name: Zero-tolerance security hardening (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-hardening-once.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  harden:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up pinned Python action
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Apply security hardening and generate secure release workflow
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          api = Path('api_client.py')
          text = api.read_text(encoding='utf-8')
          text = text.replace('import ssl\n', '')
          text = text.replace(
              'from urllib.request import HTTPSHandler, Request, build_opener\n',
              'from urllib.request import Request, build_opener\n',
          )
          old = '''        self.allow_insecure_tls = allow_insecure_tls
          self.cancel_event = cancel_event
          if allow_insecure_tls:
              context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
              context.check_hostname = False
              context.verify_mode = ssl.CERT_NONE
              self.opener = build_opener(HTTPSHandler(context=context))
          else:
              self.opener = build_opener()
          '''
          new = '''        if allow_insecure_tls:
              raise ValueError(
                  "TLS 인증서 검증 비활성화는 보안 정책상 허용되지 않습니다. "
                  "사내 CA 인증서를 Windows 신뢰 저장소에 등록해 주세요."
              )
          self.allow_insecure_tls = False
          self.cancel_event = cancel_event
          self.opener = build_opener()
          '''
          if old not in text:
              raise SystemExit('Expected insecure TLS block was not found; refusing blind patch.')
          text = text.replace(old, new, 1)
          api.write_text(text, encoding='utf-8', newline='\n')

          release = r'''name: Build signed Windows release

          on:
            workflow_dispatch:
              inputs:
                version:
                  description: "Release version (example: 6.13.2)"
                  required: true
                  default: "6.13.2"
                publish_release:
                  description: "Publish a GitHub Release"
                  required: true
                  type: boolean
                  default: false
            push:
              tags:
                - "v*"

          permissions:
            contents: write

          concurrency:
            group: release-${{ github.ref }}
            cancel-in-progress: false

          jobs:
            build:
              runs-on: windows-2025
              timeout-minutes: 45

              steps:
                - name: Check out source
                  uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
                  with:
                    persist-credentials: false

                - name: Set up Python
                  uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
                  with:
                    python-version: "3.12"
                    cache: "pip"
                    cache-dependency-path: requirements.lock

                - name: Resolve version
                  id: version
                  shell: pwsh
                  run: |
                    if ("${{ github.ref_type }}" -eq "tag") {
                      $version = "${{ github.ref_name }}" -replace '^v', ''
                    } else {
                      $version = "${{ inputs.version }}" -replace '^v', ''
                    }
                    if ($version -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
                      throw "Invalid version: $version"
                    }
                    "version=$version" >> $env:GITHUB_OUTPUT
                    "tag=v$version" >> $env:GITHUB_OUTPUT

                - name: Security policy gate
                  shell: pwsh
                  run: |
                    python security_gate.py

                - name: Install hash-locked dependencies
                  shell: pwsh
                  run: |
                    python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements.lock

                - name: Run tests
                  shell: pwsh
                  run: python -m unittest discover -s . -p "test_*.py"

                - name: Build standalone EXE
                  shell: pwsh
                  run: ./build_exe_ci.ps1 -Version "${{ steps.version.outputs.version }}"

                - name: Require signing secrets
                  shell: pwsh
                  env:
                    SIGN_CERT: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_B64 }}
                    SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
                  run: |
                    if ([string]::IsNullOrWhiteSpace($env:SIGN_CERT) -or [string]::IsNullOrWhiteSpace($env:SIGN_PASSWORD)) {
                      throw "Release blocked: Authenticode signing secrets are not configured."
                    }

                - name: Authenticode sign executable
                  shell: pwsh
                  env:
                    SIGN_CERT: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_B64 }}
                    SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
                  run: |
                    $certPath = Join-Path $env:RUNNER_TEMP 'kipris-signing.pfx'
                    try {
                      [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGN_CERT))
                      $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
                        Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
                        Sort-Object FullName -Descending |
                        Select-Object -First 1
                      if (-not $signtool) { throw 'signtool.exe not found' }
                      $exe = Get-ChildItem release\KIPRIS_Document_Hub_v*.exe | Select-Object -First 1
                      & $signtool.FullName sign /fd SHA256 /f $certPath /p $env:SIGN_PASSWORD $exe.FullName
                      if ($LASTEXITCODE -ne 0) { throw "signtool failed: $LASTEXITCODE" }
                      $signature = Get-AuthenticodeSignature $exe.FullName
                      if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($signature.Status)" }
                    }
                    finally {
                      if (Test-Path $certPath) { Remove-Item -LiteralPath $certPath -Force }
                    }

                - name: Recreate checksums after signing
                  shell: pwsh
                  run: |
                    $exe = Get-ChildItem release\KIPRIS_Document_Hub_v*.exe | Select-Object -First 1
                    $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
                    "$hash  $($exe.Name)" | Set-Content -Encoding ascii release\SHA256SUMS.txt

                - name: Upload workflow artifact
                  uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
                  with:
                    name: KIPRIS_Document_Hub_v${{ steps.version.outputs.version }}_Windows
                    path: release/*
                    if-no-files-found: error
                    retention-days: 30

                - name: Publish GitHub Release
                  if: github.ref_type == 'tag' || inputs.publish_release == true
                  shell: pwsh
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: |
                    $tag = "${{ steps.version.outputs.tag }}"
                    gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
                    if ($LASTEXITCODE -ne 0) {
                      gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "KIPRIS Document Hub v${{ steps.version.outputs.version }}" --generate-notes --latest
                    }
                    gh release upload $tag release/* --clobber --repo $env:GITHUB_REPOSITORY
          '''
          # Remove indentation introduced by embedding the YAML in this workflow script.
          release = '\n'.join(line[10:] if line.startswith('          ') else line for line in release.splitlines()) + '\n'
          Path('.github/workflows/release.yml').write_text(release, encoding='utf-8', newline='\n')

          gate = r'''from __future__ import annotations

          from pathlib import Path
          import re

          FORBIDDEN = {
              "TLS certificate verification disabled": [
                  r"ssl\.CERT_NONE",
                  r"verify\s*=\s*False",
                  r"check_hostname\s*=\s*False",
                  r"_create_unverified_context",
              ],
              "destructive shell command": [
                  r"\brm\s+-rf\b",
                  r"\bchmod\s+777\b",
                  r"\bDROP\s+TABLE\b",
              ],
          }
          SCAN_SUFFIXES = {'.py', '.ps1', '.bat', '.vbs', '.yml', '.yaml'}
          EXCLUDES = {Path('.github/workflows/security-hardening-once.yml'), Path('security_gate.py')}

          failures: list[str] = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in SCAN_SUFFIXES or path in EXCLUDES:
                  continue
              try:
                  text = path.read_text(encoding='utf-8', errors='replace')
              except OSError:
                  continue
              for label, patterns in FORBIDDEN.items():
                  for pattern in patterns:
                      if re.search(pattern, text, flags=re.IGNORECASE):
                          failures.append(f'{path}: {label} ({pattern})')
          if failures:
              raise SystemExit('Security policy violation(s):\n' + '\n'.join(failures))
          print('Zero-tolerance static security gate passed.')
          '''
          gate = '\n'.join(line[10:] if line.startswith('          ') else line for line in gate.splitlines()) + '\n'
          Path('security_gate.py').write_text(gate, encoding='utf-8', newline='\n')
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\harden.py
          python $env:RUNNER_TEMP\harden.py

      - name: Download Windows wheels for lock generation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force wheelhouse | Out-Null
          python -m pip download --disable-pip-version-check --only-binary=:all: --dest wheelhouse -r requirements.txt pyinstaller==6.22.2

      - name: Generate hash-locked dependency manifest using standard library only
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from zipfile import ZipFile
          from email.parser import Parser
          import hashlib
          import re

          def canonical(name: str) -> str:
              return re.sub(r'[-_.]+', '-', name).lower()

          rows = []
          for wheel in sorted(Path('wheelhouse').glob('*.whl')):
              with ZipFile(wheel) as zf:
                  metas = [n for n in zf.namelist() if n.endswith('.dist-info/METADATA')]
                  if len(metas) != 1:
                      raise SystemExit(f'Unexpected wheel metadata layout: {wheel.name}')
                  meta = Parser().parsestr(zf.read(metas[0]).decode('utf-8', 'replace'))
              name = canonical(meta['Name'])
              version = meta['Version']
              digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
              rows.append((name, version, digest, wheel.name))

          seen = set()
          lines = [
              '# Generated for CPython 3.12 / Windows x64 by the reviewed hardening workflow.',
              '# Every resolved build/runtime wheel is SHA-256 pinned.',
          ]
          for name, version, digest, filename in sorted(rows):
              if name in seen:
                  raise SystemExit(f'Duplicate resolved distribution: {name}')
              seen.add(name)
              lines.append(f'{name}=={version} --hash=sha256:{digest}  # {filename}')
          Path('requirements.lock').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\make_lock.py
          python $env:RUNNER_TEMP\make_lock.py

      - name: Verify locked install offline and run tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-index --find-links wheelhouse --only-binary=:all: --require-hashes -r requirements.lock
          python security_gate.py
          python -m unittest discover -s . -p "test_*.py"

      - name: Create review branch and pull request
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branch = 'security/zero-tolerance-v6.13.2'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b $branch
          git add -- api_client.py requirements.lock security_gate.py .github/workflows/release.yml
          git commit -m 'Harden release pipeline for zero-tolerance security'
          git push origin $branch
          gh pr create --base main --head $branch --title 'Zero-tolerance security hardening for v6.13.2' --body 'Removes TLS verification bypass, adds a static security gate, hash-locks all Windows/Python dependencies, pins GitHub Actions by immutable commit SHA, fixes the runner to windows-2025, and makes Authenticode signing mandatory before artifacts or Releases can be published.'
