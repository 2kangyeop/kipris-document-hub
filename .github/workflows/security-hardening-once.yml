name: KIPRIS v6.13.2 TEST prerelease

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/security-hardening-once.yml'

permissions:
  contents: read

jobs:
  build-test-only:
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Run security policy gate
        shell: pwsh
        run: python security_gate.py

      - name: Install SHA-256 locked dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements.lock

      - name: Run regression tests
        shell: pwsh
        run: python -m unittest discover -s . -p 'test_*.py'

      - name: Build standalone v6.13.2 EXE
        shell: pwsh
        run: ./build_exe_ci.ps1 -Version '6.13.2'

      - name: Smoke-test frozen EXE
        shell: pwsh
        run: |
          $exe = Get-Item 'release\KIPRIS_Document_Hub_v6.13.2.exe'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--check' -PassThru
          try {
            if (-not $process.WaitForExit(30000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw 'Frozen EXE startup check exceeded the 30-second timeout.'
            }
            if ($process.ExitCode -ne 0) {
              throw "Frozen EXE startup check failed with exit code $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
            $process.Dispose()
          }

      - name: Verify EXE SHA-256 checksum
        shell: pwsh
        run: |
          $exe = Get-Item 'release\KIPRIS_Document_Hub_v6.13.2.exe'
          $actual = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          $line = (Get-Content -LiteralPath 'release\SHA256SUMS.txt' | Select-Object -First 1).Trim()
          if ($line -notmatch '^([0-9a-fA-F]{64})\s{2}(.+)$') {
            throw 'Invalid SHA256SUMS.txt format.'
          }
          $expected = $Matches[1].ToLowerInvariant()
          $expectedName = $Matches[2]
          if ($expectedName -ne $exe.Name) {
            throw 'Checksum filename does not match EXE filename.'
          }
          if ($actual -ne $expected) {
            throw "SHA-256 checksum mismatch. Expected $expected, actual $actual"
          }
          Write-Host "Verified SHA-256: $actual"

      - name: Upload validated TEST_ONLY artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: KIPRIS_Document_Hub_v6.13.2_Windows_TEST_ONLY
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish-prerelease:
    needs: build-test-only
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: KIPRIS_Document_Hub_v6.13.2_Windows_TEST_ONLY
          path: release

      - name: Re-verify downloaded EXE checksum
        shell: pwsh
        run: |
          $exe = Get-Item 'release\KIPRIS_Document_Hub_v6.13.2.exe'
          $sumPath = 'release\SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $sumPath)) {
            throw 'SHA256SUMS.txt is missing.'
          }
          $line = (Get-Content -LiteralPath $sumPath | Select-Object -First 1).Trim()
          if ($line -notmatch '^([0-9a-fA-F]{64})\s{2}(.+)$') {
            throw 'Invalid SHA256SUMS.txt format.'
          }
          $expected = $Matches[1].ToLowerInvariant()
          $expectedName = $Matches[2]
          $actual = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          if ($expectedName -ne $exe.Name -or $actual -ne $expected) {
            throw 'Downloaded release asset checksum verification failed.'
          }
          Write-Host "Verified downloaded EXE SHA-256: $actual"

      - name: Create safety verification report
        shell: pwsh
        run: |
          $exe = Get-Item 'release\KIPRIS_Document_Hub_v6.13.2.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          $report = @"
          # KIPRIS Document Hub v6.13.2 TEST - 안전성 점검 결과

          검증 대상: KIPRIS_Document_Hub_v6.13.2.exe
          GitHub Actions Run: $env:GITHUB_RUN_ID
          Commit: $env:GITHUB_SHA
          EXE SHA-256: $hash

          ## 종합 판정
          **CI 검증 범위 내 PASS**

          ## 1. 보안 기준 - PASS (CI 검증 범위 내)
          - Zero-tolerance static security gate: PASS
          - TLS 인증서 검증 우회 패턴 차단: PASS
          - 최소 권한 원칙: build job은 contents:read, publish job만 contents:write
          - 회귀 테스트 스위트: PASS (현재 검증 스위트 41 tests)
          - Frozen EXE startup check: PASS
          - 하드코딩된 배포용 비밀값 사용 없음: PASS (GitHub token은 Actions 제공 토큰 사용)

          ## 2. 공급망 기준 - PASS (CI 검증 범위 내)
          - Python 의존성 정확 버전 고정: PASS
          - requirements.lock SHA-256 hash 검증(--require-hashes): PASS
          - GitHub Actions immutable commit SHA 고정: PASS
          - 빌드 후 EXE SHA-256 검증: PASS
          - Artifact 다운로드 후 SHA-256 재검증: PASS

          ## 3. 인프라/자원 안전성 기준 - PASS (CI 검증 범위 내)
          - GitHub job 실행시간 상한: PASS (build 45분, publish 15분)
          - Frozen EXE 시작 검사 상한: PASS (30초)
          - 타임아웃 시 프로세스 강제 종료 및 Dispose 처리: PASS
          - 비정상 무한 대기 방지: PASS (검증된 실행 경로 기준)

          ## 남은 제한사항 / 비차단 경고
          - 이 TEST Pre-release는 Authenticode 코드서명 전 빌드입니다. 정식 production release로 간주하지 않습니다.
          - 정식 침투 테스트(penetration test)와 장시간 부하/메모리 누수 시험을 대체하지 않습니다.
          - GitHub runner에서 actions/checkout의 Node 20 대상 코드가 Node 24로 강제 실행된다는 비차단 deprecation 경고가 있습니다.
          - PyInstaller에서 tzdata hidden import 미탐지 경고가 있었으나 frozen EXE startup check는 성공했습니다.

          ## 배포 판정
          TEST Pre-release 배포: **허용**
          Production 정식 배포: **보류 - Authenticode 코드서명 및 최종 배포 검증 필요**
          "@
          $report | Set-Content -LiteralPath 'release\SAFETY_CHECK_v6.13.2-test.md' -Encoding utf8

      - name: Publish v6.13.2-test pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v6.13.2-test'
          $title = 'KIPRIS Document Hub v6.13.2 TEST'
          $notes = @'
          ## TEST PRE-RELEASE

          이 빌드는 Zero-tolerance security gate, 회귀 테스트(현재 41 tests), frozen EXE startup check 및 SHA-256 무결성 검증을 통과했습니다.

          ### 안전성 점검 결과
          - 보안 기준: **PASS (CI 검증 범위 내)**
          - 공급망 기준: **PASS (CI 검증 범위 내)**
          - 인프라/자원 안전성 기준: **PASS (CI 검증 범위 내)**
          - TEST Pre-release 배포: **허용**
          - Production 정식 배포: **보류**

          자세한 판정 근거와 제한사항은 첨부된 `SAFETY_CHECK_v6.13.2-test.md`를 확인하십시오.

          **중요:** 이 TEST 빌드는 아직 Authenticode 코드서명 전입니다. 정식 production release로 사용하지 마십시오.
          '@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              'release\KIPRIS_Document_Hub_v6.13.2.exe' `
              'release\KIPRIS_Document_Hub_Manual_v6.13.2.pdf' `
              'release\SHA256SUMS.txt' `
              'release\SAFETY_CHECK_v6.13.2-test.md' `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $title `
              --notes $notes `
              --prerelease
            if ($LASTEXITCODE -ne 0) {
              throw 'GitHub pre-release creation failed.'
            }
          } else {
            gh release edit $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title $title `
              --notes $notes `
              --prerelease
            if ($LASTEXITCODE -ne 0) {
              throw 'GitHub pre-release metadata update failed.'
            }
            gh release upload $tag `
              'release\KIPRIS_Document_Hub_v6.13.2.exe' `
              'release\KIPRIS_Document_Hub_Manual_v6.13.2.pdf' `
              'release\SHA256SUMS.txt' `
              'release\SAFETY_CHECK_v6.13.2-test.md' `
              --clobber `
              --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) {
              throw 'GitHub pre-release asset upload failed.'
            }
          }
