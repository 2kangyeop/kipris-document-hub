name: Build v6.13.2 TEST_ONLY (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-only:
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Run security policy gate
        shell: pwsh
        run: python security_gate.py

      - name: Install SHA-256 locked dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements.lock

      - name: Run regression tests
        shell: pwsh
        run: python -m unittest discover -s . -p "test_*.py"

      - name: Build standalone v6.13.2 EXE
        shell: pwsh
        run: ./build_exe_ci.ps1 -Version "6.13.2"

      - name: Smoke-test frozen EXE with 30-second timeout
        shell: pwsh
        run: |
          $exe = Resolve-Path 'release\KIPRIS_Document_Hub_v6.13.2.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--check' -PassThru
          try {
            if (-not $process.WaitForExit(30000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw 'Frozen EXE startup check exceeded the 30-second safety timeout.'
            }
            if ($process.ExitCode -ne 0) {
              throw "Frozen EXE startup check failed with exit code $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
            $process.Dispose()
          }

      - name: Verify EXE SHA-256 checksum
        shell: pwsh
        run: |
          $exe = Get-Item 'release\KIPRIS_Document_Hub_v6.13.2.exe'
          $actual = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          $line = (Get-Content 'release\SHA256SUMS.txt' | Select-Object -First 1).Trim()
          $expected = ($line -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "SHA-256 checksum mismatch. Expected $expected, actual $actual"
          }
          Write-Host "Verified SHA-256: $actual"

      - name: Upload TEST_ONLY artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: KIPRIS_Document_Hub_v6.13.2_Windows_TEST_ONLY
          path: release/*
          if-no-files-found: error
          retention-days: 7
